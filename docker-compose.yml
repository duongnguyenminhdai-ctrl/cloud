networks:
  food-net:
    name: food-net
    driver: bridge

services:
  # ============================================================================
  # 1. Message Broker: RabbitMQ 3 Management
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - food-net

  # ============================================================================
  # 2. In-Memory Cache: Redis 7 Alpine
  # ============================================================================
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - food-net

  # ============================================================================
  # 3. Auth Service (Port 3005 - DB: auth_db)
  # ============================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    volumes:
      - ./services/auth-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3005
      MONGO_URI: ${MONGO_URI_AUTH}
      MONGO_URI_AUTH: ${MONGO_URI_AUTH}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EMAIL_USER: ${EMAIL_USER:-nguyenminhdaiduongtest1@gmail.com}
      EMAIL_APP_PASS: ${EMAIL_APP_PASS:-nlqn ezsz ggjt wmnj}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-nlqn ezsz ggjt wmnj}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-706124961536-m0cegjnn45imfdo5ejpcseaafkdnjg8m.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - food-net

  # ============================================================================
  # 4. Restaurant Service (Port 3001 - DB: restaurant_db & Redis Cache)
  # ============================================================================
  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: restaurant-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./services/restaurant-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3001
      MONGO_URI: ${MONGO_URI_RESTAURANT}
      MONGO_URI_RESTAURANT: ${MONGO_URI_RESTAURANT}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - food-net

  # ============================================================================
  # 5. Order Service (Port 3002 - DB: order_db)
  # ============================================================================
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./services/order-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3002
      MONGO_URI: ${MONGO_URI_ORDER}
      MONGO_URI_ORDER: ${MONGO_URI_ORDER}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - food-net

  # ============================================================================
  # 6. Payment Service (Port 3003 - DB: payment_db)
  # ============================================================================
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - ./services/payment-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3003
      MONGO_URI: ${MONGO_URI_PAYMENT}
      MONGO_URI_PAYMENT: ${MONGO_URI_PAYMENT}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      VNP_TMN_CODE: ${VNP_TMN_CODE:-IUTMI3S7}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-B9LR7MFU07P4UOLZ8EH4RJ5CXD2OTYH5}
      VNP_URL: ${VNP_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay-return}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - food-net

  # ============================================================================
  # 7. Delivery Service (Port 3004 - DB: delivery_db)
  # ============================================================================
  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: delivery-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - ./services/delivery-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3004
      MONGO_URI: ${MONGO_URI_DELIVERY}
      MONGO_URI_DELIVERY: ${MONGO_URI_DELIVERY}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - food-net

  # ============================================================================
  # 8. Frontend Web Application (React + Vite + TailwindCSS - Port 3000)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    networks:
      - food-net

  # ============================================================================
  # 9. API Gateway: Nginx Reverse Proxy (Port 8080 trên Host -> Port 80 Container)
  # ============================================================================
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - food-net
